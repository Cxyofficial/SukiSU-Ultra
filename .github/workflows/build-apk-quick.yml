name: Build Manager Quick

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Put ksud binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          B=https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases/download/v4.3.0-r1
          curl -fsSL -o app/src/main/jniLibs/arm64-v8a/libksud.so  "$B/ksud-aarch64-linux-android"
          curl -fsSL -o app/src/main/jniLibs/armeabi-v7a/libksud.so "$B/ksud-armv7-linux-androideabi"
          curl -fsSL -o app/src/main/jniLibs/x86_64/libksud.so "$B/ksud-x86_64-linux-android"
          ls -l app/src/main/jniLibs/*/libksud.so

      - name: Temporary keystore
        run: |
          keytool -genkeypair -alias k -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 -dname "CN=SukiSU Fork" \
            -storetype JKS -keystore key.jks
          {
            echo KEYSTORE_PASSWORD=123456
            echo KEY_ALIAS=k
            echo KEY_PASSWORD=123456
            echo KEYSTORE_FILE=key.jks
          } >> gradle.properties

      - name: Build with Gradle
        run: ./gradlew clean assembleRelease --no-daemon --no-build-cache -Dorg.gradle.caching=false --stacktrace

      - name: Show result
        if: always()
        run: ls -l app/build/outputs/apk/release/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: apk-quick
          path: manager/app/build/outputs/apk/release/*.apk
